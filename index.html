<script language=javascript>
	var rev = "fwd";
	function titlebar(val) {
		var msg = "Ｌ Ｏ Ｕ Ｖ Ｋ Ｉ";

		var speed = 100;

		var decos = [
			'•၊၊||၊|။||||||၊|၊၊•',
			'─────୨ৎ─────',
			'✧･ﾟ: *✧･ﾟ:*',
			'⋆｡°✩⋆｡°✩',
			'▰▱▰▱▰▱▰▱',
			'◈◇◈◇◈◇◈◇',
			'꒰ঌ┈┈┈┈໒꒱'
		];
		var decoIndex = 0;
		var rotationCount = 0;

		function getDeco() {
			return decos[decoIndex % decos.length];
		}

		function buildHalfMessage() {
			var deco = getDeco();
			return deco + msg + deco + msg;
		}

		let updatedString = buildHalfMessage() + buildHalfMessage();
		let halfLength = buildHalfMessage().length;
		document.title = updatedString;

		let secondCounter = 0;
		trimMe();

		function trimMe() {
			updatedString = updatedString.slice(1);
			document.title = updatedString;

			if (secondCounter === halfLength) {
				rotationCount++;

				if (rotationCount % 2 === 0) {
					decoIndex++;
				}
				updatedString += buildHalfMessage();
				halfLength = buildHalfMessage().length;
				secondCounter = 0;
			}

			// console.log('updatedString', updatedString);

			secondCounter++;
			window.setTimeout(trimMe, speed);
		}

	}
	titlebar(0);
</script>
